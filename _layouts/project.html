---
layout: default
---

<article class="project-page{% if page.wide_hero %} project-page--wide-hero{% endif %}">

<h1>{{ page.title }}</h1>

{% if page.wide_hero %}
<figure class="project-hero">
  <img src="{{ page.image | relative_url }}" alt="{{ page.imagealt }}" />
  {% if page.hero_caption %}<figcaption>{{ page.hero_caption }}</figcaption>{% endif %}
</figure>
{% else %}
<p><img src="{{ page.image | relative_url }}" alt="{{ page.imagealt }}" class="project-image" /></p>
{% endif %}

{{ content }}

<p><strong>Technologies Used</strong>: {{ page.technologies | join: ", " }}</p>

<a href={{ "/projects/" | relative_url }} class="back-arrow">
    <i class="bi bi-arrow-left-circle-fill"></i> Back to Projects
</a>

</article>
